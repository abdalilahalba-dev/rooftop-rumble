<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rooftop Rumble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap">
<style>
  /* Layout: one 16:9 arena canvas centred in the window; HTML layer on top (menu card, room bar, touch buttons) scaled with it. Single dusk-rooftop look. */
  :root {
    --page: #120b24;
    --panel: #1d1338;
    --panel-2: #2a1d4d;
    --ink: #fbf5ff;
    --muted: #b6a8d6;
    --hot: #ff5a3c;
    --hot-dark: #b8321c;
    --lime: #b8ff3c;
    --line: rgba(255, 255, 255, 0.14);
    --font-display: "Bungee", "Arial Black", Impact, sans-serif;
    --font-body: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-body);
    overflow: hidden; display: grid; place-items: center;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  .game { position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6); touch-action: none; }
  #cv { display: block; width: 100%; height: 100%; }
  .ui { position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 0 0; pointer-events: none; }
  .ui > * { pointer-events: auto; }

  .top-tools { position: absolute; top: 10px; right: 12px; display: flex; gap: 8px; }
  .chip-btn {
    border: 0; border-radius: 8px; height: 32px; padding: 0 12px; cursor: pointer;
    background: rgba(0, 0, 0, 0.45); color: var(--ink); font: 400 13px var(--font-display); letter-spacing: 0.04em;
  }
  .chip-btn:hover { background: rgba(0, 0, 0, 0.65); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }

  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10, 6, 24, 0.55); }
  .card {
    width: 620px; max-width: calc(100% - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 22px 24px; display: grid; gap: 14px;
    box-shadow: 0 8px 0 #0a0616;
  }
  .title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 44px; line-height: 0.95; color: var(--hot); text-shadow: 0 4px 0 var(--hot-dark); }
  .title small { display: block; font-size: 15px; color: var(--muted); text-shadow: none; letter-spacing: 0.12em; margin-top: 8px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .field { display: grid; gap: 6px; flex: 1; min-width: 0; }
  .field label { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  input[type=text] {
    height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--ink); font: 700 16px var(--font-body); padding: 0 12px; min-width: 0;
  }
  .swatches { display: flex; gap: 6px; }
  .sw { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; }
  .sw[aria-pressed="true"] { border-color: var(--ink); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode {
    text-align: left; border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    background: var(--panel-2); color: var(--ink); padding: 12px 14px; display: grid; gap: 4px;
    font: 400 16px var(--font-display);
  }
  .mode span { font: 400 13px var(--font-body); color: var(--muted); }
  .mode:hover { border-color: rgba(255, 255, 255, 0.35); }
  .mode.big { background: var(--hot); border-color: var(--hot); box-shadow: 0 4px 0 var(--hot-dark); }
  .mode.big span { color: #ffe1d9; }
  .mode:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn {
    height: 40px; padding: 0 16px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--lime); color: #1d2600; font: 400 15px var(--font-display);
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .note { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .note b { color: var(--ink); }
  .err { color: #ff9b8a; }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; font-size: 12.5px; color: var(--muted); margin: 0; }
  .keys b { color: var(--ink); font-weight: 700; }

  .roombar {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px;
    background: rgba(10, 6, 24, 0.78); border: 1px solid var(--line); border-radius: 12px; font-size: 13px; white-space: nowrap;
  }
  .roombar .code { font: 400 18px var(--font-display); color: var(--lime); letter-spacing: 0.06em; }
  .seg { display: flex; background: var(--panel-2); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: 700 12px var(--font-body); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--hot); color: #fff; }
  .seg button:disabled { cursor: default; }

  .touch { position: absolute; bottom: 14px; display: flex; gap: 10px; }
  .touch.left { left: 14px; } .touch.right { right: 14px; }
  .tb {
    width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35);
    background: rgba(0, 0, 0, 0.35); color: #fff; font: 400 18px var(--font-display); touch-action: none;
  }
  .tb.on { background: rgba(255, 90, 60, 0.6); }
</style>
</head>
<body>

<div class="game" id="game">
  <canvas id="cv"></canvas>
  <div class="ui" id="ui">
    <div class="top-tools">
      <button class="chip-btn" id="b-menu" type="button" hidden>MENU</button>
      <button class="chip-btn" id="b-mute" type="button" aria-label="Sound on or off">♪</button>
    </div>

    <div class="roombar" id="roombar" hidden>
      <span>Room</span><span class="code" id="rb-code">----</span>
      <button class="chip-btn" id="rb-copy" type="button">COPY</button>
      <span id="rb-count">1 player</span>
      <div class="seg" role="group" aria-label="Game mode">
        <button type="button" id="rb-pvp" aria-pressed="true">Friends battle</button>
        <button type="button" id="rb-coop" aria-pressed="false">Team vs monsters</button>
      </div>
    </div>

    <div class="touch left" id="touch-l" hidden>
      <button class="tb" data-k="left" type="button" aria-label="Move left">◀</button>
      <button class="tb" data-k="right" type="button" aria-label="Move right">▶</button>
      <button class="tb" data-k="jump" type="button" aria-label="Jump">▲</button>
    </div>
    <div class="touch right" id="touch-r" hidden>
      <button class="tb" data-k="punch" type="button" aria-label="Punch">P</button>
      <button class="tb" data-k="kick" type="button" aria-label="Kick">K</button>
      <button class="tb" data-k="special" type="button" aria-label="Headbutt">H</button>
      <button class="tb" data-k="dodge" type="button" aria-label="Dodge">»</button>
    </div>

    <div class="overlay" id="ov-menu">
      <div class="card">
        <h1 class="title">ROOFTOP RUMBLE<small>PUNCH · KICK · HEADBUTT</small></h1>
        <div class="row">
          <div class="field"><label for="in-name">Your name</label><input type="text" id="in-name" maxlength="12" autocomplete="off" spellcheck="false"></div>
          <div class="field" style="flex:0 0 auto"><label>Color</label><div class="swatches" id="swatches"></div></div>
        </div>
        <div class="modes">
          <button class="mode big" id="m-create" type="button">CREATE ROOM<span>Get a code, send it to your friends</span></button>
          <div class="mode" style="cursor:default">JOIN ROOM
            <div class="row" style="margin-top:4px">
              <input type="text" id="in-code" maxlength="6" placeholder="CODE" autocomplete="off" spellcheck="false" style="flex:1;text-transform:uppercase;letter-spacing:0.12em">
              <button class="btn" id="m-join" type="button">JOIN</button>
            </div>
          </div>
          <button class="mode" id="m-solo" type="button">SOLO VS MONSTERS<span>Survive the waves on your own</span></button>
          <button class="mode" id="m-local" type="button">2 PLAYERS, 1 KEYBOARD<span>Fight a friend sitting next to you</span></button>
        </div>
        <p class="note" id="net-note">Checking if online rooms are available…</p>
        <div class="keys">
          <span><b>Move</b> A D or ← →</span><span><b>Jump</b> W or ↑ (twice to double jump)</span>
          <span><b>Punch</b> right click · <b>Dodge</b> left click</span><span><b>Kick</b> E · <b>Headbutt</b> Q · <b>Drop down</b> S</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  // =====================================================================
  // constants
  // =====================================================================
  const W = 960, H = 540, FLOOR = 470;
  const PLATFORMS = [{ x: 120, y: 350, w: 210 }, { x: 630, y: 350, w: 210 }, { x: 370, y: 235, w: 220 }];
  const GRAV = 1900, SPEED = 290, JUMP = 740, MAX_HP = 100;
  const ATTACKS = {
    punch: { start: 0.05, end: 0.15, total: 0.26, dmg: 7, kx: 260, ky: -150, box: [14, -60, 48, 26] },
    kick: { start: 0.13, end: 0.25, total: 0.42, dmg: 12, kx: 430, ky: -320, box: [10, -36, 58, 28] },
    head: { start: 0.15, end: 0.28, total: 0.5, dmg: 15, kx: 500, ky: -260, box: [4, -84, 42, 36], cd: 0.9, lunge: 380 }
  };
  const ATTACK_KINDS = ['punch', 'kick', 'head'];
  const HIT_WORDS = { punch: ['POW!', 'BAP!', 'SMACK!'], kick: ['WHAM!', 'THWACK!', 'KAPOW!'], head: ['BONK!', 'CRACK!', 'DONK!'], enemy: ['OOF!', 'OUCH!'] };
  const HIT_COLORS = { punch: '#ffe14d', kick: '#ff8a2a', head: '#ff5fb2', enemy: '#ff5a3c' };
  const FIRE = { dmg: 10, kx: 340, ky: -170, speed: 560, r: 14, life: 1.5 };
  const COLORS = ['#ff5a3c', '#3c9dff', '#b8ff3c', '#ffcf3c', '#c46bff', '#3cffd5', '#ff5fb2', '#f2f2f2'];
  const ENEMY_TYPES = [
    { name: 'goon', hp: 30, speed: 150, dmg: 8, w: 22, h: 52, range: 52, wind: 0.28, act: 0.42, total: 0.7, kx: 300, ky: -200, color: '#4fbf5a' },
    { name: 'brute', hp: 85, speed: 95, dmg: 16, w: 34, h: 74, range: 66, wind: 0.45, act: 0.62, total: 1.0, kx: 520, ky: -360, color: '#8d4fd9' },
    { name: 'bat', hp: 18, speed: 175, dmg: 7, w: 18, h: 18, range: 0, wind: 0, act: 0, total: 0, kx: 220, ky: -160, color: '#3a2f55' }
  ];

  // =====================================================================
  // sizing
  // =====================================================================
  const game = document.getElementById('game'), cv = document.getElementById('cv'), ctx = cv.getContext('2d'), ui = document.getElementById('ui');
  const $ = (id) => document.getElementById(id);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let scale = 1, dpr = 1;
  function fit() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    scale = Math.max(0.3, Math.min((window.innerWidth - 24) / W, (window.innerHeight - 24) / H));
    game.style.width = W * scale + 'px'; game.style.height = H * scale + 'px';
    cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
    ui.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fit); fit();

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // =====================================================================
  // sound
  // =====================================================================
  let muted = store.get('rr-muted', false), ac = null;
  function tone(freq, dur, type = 'square', vol = 0.05, slideTo = null, delay = 0) {
    if (muted) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function noise(dur, vol) {
    if (muted) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2;
      const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf; g.gain.value = vol;
      s.connect(g).connect(ac.destination); s.start();
    } catch (e) {}
  }
  const sfx = {
    swing() { tone(220, 0.06, 'triangle', 0.03, 120); },
    hit() { noise(0.12, 0.25); tone(160, 0.1, 'square', 0.05, 70); },
    fire() { tone(500, 0.18, 'sawtooth', 0.035, 900); },
    jump() { tone(330, 0.08, 'triangle', 0.035, 520); },
    dodge() { tone(900, 0.12, 'sine', 0.04, 300); },
    ko() { noise(0.4, 0.35); [392, 262, 196].forEach((f, i) => tone(f, 0.15, 'square', 0.05, null, i * 0.09)); },
    wave() { [523, 659, 784].forEach((f, i) => tone(f, 0.12, 'square', 0.04, null, i * 0.08)); }
  };

  // =====================================================================
  // input
  // =====================================================================
  const down = new Set(), pressed = new Set();
  const MAPS = {
    // right click punches, left click dodges, E kicks, Q headbutts
    any: { left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], jump: ['KeyW', 'ArrowUp', 'Space'], down: ['KeyS', 'ArrowDown'], punch: ['Mouse2', 'KeyJ'], kick: ['KeyE', 'KeyK'], special: ['KeyQ', 'KeyL'], dodge: ['Mouse0', 'ShiftLeft', 'ShiftRight'] },
    p1: { left: ['KeyA'], right: ['KeyD'], jump: ['KeyW'], down: ['KeyS'], punch: ['KeyF'], kick: ['KeyE'], special: ['KeyQ'], dodge: ['ShiftLeft'] },
    p2: { left: ['ArrowLeft'], right: ['ArrowRight'], jump: ['ArrowUp'], down: ['ArrowDown'], punch: ['KeyK', 'Numpad1'], kick: ['KeyL', 'Numpad2'], special: ['Semicolon', 'Numpad3'], dodge: ['ShiftRight', 'Numpad0'] }
  };
  const touch = { left: false, right: false, jump: false, punch: false, kick: false, special: false, dodge: false, edge: new Set() };
  // mouse buttons count as keys while a match is on
  game.addEventListener('contextmenu', (e) => { if (mode !== 'menu') e.preventDefault(); });
  window.addEventListener('mousedown', (e) => {
    if (mode === 'menu' || e.target.closest('button, input, .overlay, .roombar')) return;
    const code = 'Mouse' + e.button;
    if (!down.has(code)) pressed.add(code);
    down.add(code);
  });
  window.addEventListener('mouseup', (e) => down.delete('Mouse' + e.button));
  window.addEventListener('keydown', (e) => {
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (!down.has(e.code)) pressed.add(e.code);
    down.add(e.code);
    if (e.code === 'Escape' && mode !== 'menu') openMenu();
  });
  window.addEventListener('keyup', (e) => down.delete(e.code));
  window.addEventListener('blur', () => down.clear());
  function readInput(mapName, useTouch) {
    const m = MAPS[mapName], held = (k) => m[k].some((c) => down.has(c)) || (useTouch && touch[k]);
    const tap = (k) => m[k].some((c) => pressed.has(c)) || (useTouch && touch.edge.has(k));
    return { left: held('left'), right: held('right'), down: held('down'), jump: tap('jump'), punch: tap('punch'), kick: tap('kick'), special: tap('special'), dodge: tap('dodge') };
  }
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  document.querySelectorAll('.tb').forEach((b) => {
    const k = b.dataset.k;
    const on = (e) => { e.preventDefault(); if (!touch[k]) touch.edge.add(k); touch[k] = true; b.classList.add('on'); };
    const off = (e) => { e.preventDefault(); touch[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  });

  // =====================================================================
  // fighters
  // =====================================================================
  let seqCounter = 1, projCounter = 1;
  function makeFighter(name, color, x) {
    return { name, color, x, y: FLOOR, vx: 0, vy: 0, face: x < W / 2 ? 1 : -1, onGround: true, jumps: 0, hp: MAX_HP, st: 'idle',
      atk: null, hurtT: 0, invT: 1.2, koT: 0, cd: 0, dropT: 0, projs: [], kos: 0, deaths: 0, score: 0, kb: {}, lastHitBy: null, walk: 0, local: true };
  }
  const SPAWNS = [180, 780, 330, 630, 480, 120, 840, 420];
  function respawn(f) {
    f.x = SPAWNS[Math.floor(Math.random() * SPAWNS.length)]; f.y = 120; f.vx = 0; f.vy = 0;
    f.hp = MAX_HP; f.st = 'air'; f.atk = null; f.hurtT = 0; f.invT = 1.6; f.jumps = 1;
  }
  const hurtbox = (x, y) => [x - 20, y - 66, 40, 66];
  const overlap = (a, b) => a[0] < b[0] + b[2] && a[0] + a[2] > b[0] && a[1] < b[1] + b[3] && a[1] + a[3] > b[1];
  function attackBox(x, y, face, kind) {
    const [ox, oy, w, h] = ATTACKS[kind].box;
    return [face > 0 ? x + ox : x - ox - w, y + oy, w, h];
  }
  const attackActive = (kind, t) => kind && ATTACKS[kind].box && t >= ATTACKS[kind].start && t <= ATTACKS[kind].end;

  function stepBody(b, dt, halfW, canDrop) {
    const prevY = b.y;
    b.vy += GRAV * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.onGround = false;
    if (b.y >= FLOOR) { b.y = FLOOR; b.vy = 0; b.onGround = true; }
    else if (b.vy > 0 && !(canDrop && b.dropT > 0)) {
      for (const p of PLATFORMS) {
        if (prevY <= p.y && b.y >= p.y && b.x > p.x - 6 && b.x < p.x + p.w + 6) { b.y = p.y; b.vy = 0; b.onGround = true; break; }
      }
    }
    if (b.x < halfW) { b.x = halfW; b.vx = Math.abs(b.vx) * 0.5; }
    if (b.x > W - halfW) { b.x = W - halfW; b.vx = -Math.abs(b.vx) * 0.5; }
  }

  function updateFighter(f, inp, dt) {
    f.invT = Math.max(0, f.invT - dt); f.cd = Math.max(0, f.cd - dt); f.dropT = Math.max(0, f.dropT - dt);
    for (let i = f.projs.length - 1; i >= 0; i--) {
      const p = f.projs[i]; p.x += p.vx * dt; p.life -= dt;
      if (p.life <= 0 || p.x < -30 || p.x > W + 30) f.projs.splice(i, 1);
    }
    if (f.st === 'ko') { f.koT -= dt; if (f.koT <= 0) respawn(f); return; }
    f.dodgeCd = Math.max(0, (f.dodgeCd || 0) - dt);
    if (f.dodgeT > 0) {
      // dodging: a fast dash nothing can hit
      f.dodgeT -= dt;
      f.vx = f.dodgeDir * 620 * Math.max(0.3, f.dodgeT / 0.28);
      if (Math.random() < 0.6) dust(f.x, f.y, 1);
    } else if (f.hurtT > 0) {
      f.hurtT -= dt;
      if (f.onGround) f.vx *= 0.85;
    } else if (inp.dodge && f.dodgeCd <= 0) {
      const move = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
      f.dodgeDir = move || f.face; f.dodgeT = 0.28; f.dodgeCd = 0.7; f.atk = null;
      if (!f.onGround) f.vy = Math.min(f.vy, 60);
      sfx.dodge();
    } else {
      const move = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
      const attacking = !!f.atk && f.onGround;
      const target = attacking ? 0 : move * SPEED;
      f.vx += (target - f.vx) * Math.min(1, dt * (f.onGround ? 18 : 8));
      if (move && !f.atk) f.face = move;
      if (inp.jump && (f.onGround || f.jumps < 2)) { f.vy = -JUMP * (f.onGround ? 1 : 0.88); f.jumps = f.onGround ? 1 : 2; f.onGround = false; sfx.jump(); dust(f.x, f.y, 6); }
      if (inp.down && f.onGround && f.y < FLOOR) { f.dropT = 0.25; f.y += 2; }
      if (!f.atk) {
        if (inp.punch) startAttack(f, 'punch');
        else if (inp.kick) startAttack(f, 'kick');
        else if (inp.special && f.cd <= 0) startAttack(f, 'head');
      }
    }
    if (f.atk) {
      f.atk.t += dt;
      // the headbutt lunges forward as it connects
      if (f.atk.k === 'head' && f.atk.t >= ATTACKS.head.start - 0.04 && !f.atk.lunged) { f.atk.lunged = true; f.vx = f.face * ATTACKS.head.lunge; }

  // =====================================================================

  // =====================================================================
  // hits between everyone

  function resolveHits() {
    // my attacks on monsters

  function sparks(x, y, color, n) {

  // =====================================================================

    // a short freeze when a hit lands makes it feel heavy

    }

  // =====================================================================

      ctx.fillStyle = 'rgba(255,207,60,0.55)';

  // o: {x, y, face, color, st, atk, atT, hp, name, inv, you, walk, stars, hitDir}
  function drawFighter(o) {
    const { x, y, face, color, st, atk, atT, hp, name, inv, you, walk, stars } = o;
    if (st === 'ko') return;
    const now = performance.now();
    if (inv && Math.floor(now / 80) % 2 === 0) ctx.globalAlpha = 0.45;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 5, 0, 0, Math.PI * 2); ctx.fill();

    else if (atk === 'kick') lean = phase === 'hit' ? -face * 0.18 : 0;
    else if (atk === 'punch') lean = phase === 'hit' ? face * 0.12 : 0;
    const bob = st === 'idle' ? Math.sin(now / 220) * 1.5 : 0;
    const squash = hurt ? 0.9 : 1;

    ctx.fillStyle = 'rgba(0,0,0,0.18)'; rr(-21, -34 + bob, 42, 20, 10); ctx.fill();
    ctx.fillStyle = '#1a1226'; ctx.fillRect(-21, -58 + bob, 42, 6);
    ctx.fillRect(-face * 21 - (face > 0 ? 10 : 0), -58 + bob, 10, 4);
    // face: X eyes when hurt, determined eyes otherwise

      for (const e of enemies) drawEnemy(e);
      for (const r of remoteList()) if (r.f) {
        drawFighter({ x: r.rx, y: r.ry, face: r.f.face, color: r.p.c || '#fff', st: r.f.st, atk: ATTACKS[r.f.at] ? r.f.at : null, atT: r.f.atT, hp: r.f.hp, name: (r.p.n || 'Player').slice(0, 12), inv: r.f.inv, walk: r.rx * 0.05, stars: r.starT || 0, dodgeDir: r.f.dd });
      }
      locals.forEach((f) => {
        drawFighter({ x: f.x, y: f.y, face: f.face, color: f.color, st: f.st, atk: f.atk && f.atk.k, atT: f.atk ? f.atk.t : 0, hp: Math.max(0, f.hp), name: f.name, inv: f.invT > 0, you: mode !== 'local', walk: f.walk, stars: f.starT || 0, dodgeDir: f.dodgeDir });
      });
    }
    for (const p of particles) { ctx.globalAlpha = Math.max(0, 1 - p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    ctx.globalAlpha = 1;
    drawHitFx();
    ctx.restore();
    if (mode !== 'menu') drawHud();
  }

  // =====================================================================
  // menu wiring
  // =====================================================================
  let myColor = store.get('rr-color', COLORS[0]);
  $('in-name').value = store.get('rr-name', '');
  $('in-name').addEventListener('input', () => store.set('rr-name', $('in-name').value));
  const sw = $('swatches');
  COLORS.slice(0, 6).forEach((c) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw'; b.style.background = c; b.setAttribute('aria-label', 'Color ' + c);
    b.setAttribute('aria-pressed', String(c === myColor));
    b.addEventListener('click', () => { myColor = c; store.set('rr-color', c); sw.querySelectorAll('.sw').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); });
    sw.appendChild(b);
  });
  const newCode = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 31)]).join('');
  $('m-create').addEventListener('click', () => { gameMode = 'pvp'; joinRoom(newCode(), true); });
  const doJoin = () => {
    const code = $('in-code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 3) { $('net-note').textContent = 'Type the room code your friend sent you.'; $('net-note').classList.add('err'); return; }
    joinRoom(code);
  };
  $('m-join').addEventListener('click', doJoin);
  $('in-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') doJoin(); });
  $('m-solo').addEventListener('click', () => startMatch('solo'));
  $('m-local').addEventListener('click', () => startMatch('local'));
  $('b-menu').addEventListener('click', openMenu);
  $('rb-pvp').addEventListener('click', () => setGameMode('pvp'));
  $('rb-coop').addEventListener('click', () => setGameMode('coop'));
  $('rb-copy').addEventListener('click', () => {
    const btn = $('rb-copy');
    const done = () => { btn.textContent = 'COPIED'; setTimeout(() => { btn.textContent = 'COPY'; }, 1400); };
    try { navigator.clipboard.writeText(roomCode).then(done, () => { btn.textContent = roomCode; }); } catch (e) { btn.textContent = roomCode; }
  });
  const paintMute = () => { $('b-mute').textContent = muted ? '×' : '♪'; };
  $('b-mute').addEventListener('click', () => { muted = !muted; store.set('rr-muted', muted); paintMute(); });
  paintMute();

  // =====================================================================
  // loop
  // =====================================================================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt, now);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
